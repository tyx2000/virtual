name: Release

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run
        required: true
        default: main
        type: string
      publish:
        description: Publish to npm
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event.inputs.branch }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate package
        run: npm run check

      - name: Verify publish contents
        run: npm run pack:check

  publish:
    if: github.event.inputs.publish == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build release candidate
        run: npm run build

      - name: Verify publish contents
        run: npm run pack:check

      - name: Check npm package status
        run: npm run npm:check-name

      - name: Ensure npm token is configured
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: |
          echo "::error title=Missing NPM_TOKEN::Add repository secret NPM_TOKEN before publishing."
          exit 1

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
